<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5B2C36" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Ornate Border Frame -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.4" rx="8"/>
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="#800020" stroke-width="1" stroke-opacity="0.25" rx="4"/>

  <!-- Corner Flourishes -->
  <path d="M 24 64 L 64 24" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 776 64 L 736 24" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 24 936 L 64 976" stroke="#D4AF37" stroke-width="2"/>
  <path d="M 776 936 L 736 976" stroke="#D4AF37" stroke-width="2"/>

  <!-- Central Emblem Container -->
  <g transform="translate(400, 440)" filter="url(#subtleShadow)">
    <!-- Decorative Mandala / Medallion -->
    <circle cx="0" cy="0" r="140" fill="#FFFFFF" fill-opacity="0.85" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="126" fill="none" stroke="#800020" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="114" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Traditional Apparel Silhouette Icon -->
    <!-- Stylized Kurta / Saree / Sherwani Silhouette -->
    <path d="M -45 -55 C -30 -65, 30 -65, 45 -55 L 60 -30 L 40 -20 L 45 45 C 30 55, -30 55, -45 45 L -40 -20 L -60 -30 Z" fill="#800020" fill-opacity="0.75"/>
    <!-- Collar & Placket Detail -->
    <path d="M -12 -58 L 0 -42 L 12 -58" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-42" x2="0" y2="45" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4,6"/>
    <!-- Lotus Petal Accents below -->
    <path d="M 0 52 C -20 62, -35 55, -40 70 C -20 75, 0 65, 0 52 Z" fill="#D4AF37" fill-opacity="0.6"/>
    <path d="M 0 52 C 20 62, 35 55, 40 70 C 20 75, 0 65, 0 52 Z" fill="#D4AF37" fill-opacity="0.6"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="650" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#4A1521" text-anchor="middle" letter-spacing="4">
    COSTUME STORE
  </text>
  
  <text x="400" y="685" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#800020" text-anchor="middle" letter-spacing="3">
    AUTHENTIC INDIAN TRADITIONAL ATTIRE
  </text>

  <line x1="320" y1="715" x2="480" y2="715" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <circle cx="400" cy="715" r="4" fill="#800020"/>

  <text x="400" y="750" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#7A6855" text-anchor="middle" letter-spacing="1.5">
    Photograph Preview Coming Soon
  </text>
</svg>