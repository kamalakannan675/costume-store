services:
  - type: web
    name: costume-store-online
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT 'app:app'"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: costume-store-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OTP_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_MODE
        value: test
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MAIL_ENABLED
        value: "False"
      - key: STORAGE_BACKEND
        value: local

databases:
  - name: costume-store-db
    databaseName: costumestore
    user: costumeadmin
    plan: free
