{% extends 'base.html' %}

{% block title %}Sign In | COSTUME STORE{% endblock %}

{% block content %}
<div style="max-width:480px;margin:48px auto;padding:0 20px;">
  <div style="background:#FFFFFF;border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);padding:36px;">
    
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--secondary-light);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:12px;">
        <i class="fas fa-user-lock"></i>
      </div>
      <h2 style="font-size:1.6rem;margin:0 0 6px 0;color:var(--text-dark);">Customer Sign In</h2>
      <p style="font-size:0.85rem;color:var(--text-muted);margin:0;">Enter your registered email and password</p>
    </div>

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" id="loginForm">
      <div style="margin-bottom:20px;">
        <label for="loginEmail" style="display:block;font-size:0.85rem;font-weight:700;margin-bottom:6px;color:var(--text-dark);">
          Email Address <span style="color:var(--danger);">*</span>
        </label>
        <div style="position:relative;">
          <input type="email" id="loginEmail" name="email" required autocomplete="email"
                 value="{{ email or '' }}"
                 placeholder="name@example.com" 
                 style="width:100%;padding:12px 14px 12px 40px;border:1px solid var(--border-color);border-radius:var(--radius-sm);outline:none;font-size:0.9rem;transition:border-color 0.2s ease;">
          <i class="fas fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem;"></i>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <label for="loginPassword" style="font-size:0.85rem;font-weight:700;margin:0;color:var(--text-dark);">
            Password <span style="color:var(--danger);">*</span>
          </label>
          <a href="{{ url_for('forgot_password') }}" 
             style="font-size:0.8rem;color:var(--accent);text-decoration:none;font-weight:600;">
            Forgot Password?
          </a>
        </div>
        <div style="position:relative;display:flex;align-items:center;">
          <input type="password" id="loginPassword" name="password" required autocomplete="current-password"
                 placeholder="Enter your password" 
                 style="width:100%;padding:12px 44px 12px 40px;border:1px solid var(--border-color);border-radius:var(--radius-sm);outline:none;font-size:0.9rem;">
          <i class="fas fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem;"></i>
          <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" 
                  style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:8px 10px;color:var(--text-muted);font-size:1rem;"
                  aria-label="Show Password" title="Show Password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--text-dark);cursor:pointer;user-select:none;">
          <input type="checkbox" name="remember_me" value="1" style="accent-color:var(--primary);width:16px;height:16px;">
          <span>Remember Me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-sm" style="width:100%;padding:13px;font-size:0.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-sm);">
        <span>Sign In</span> <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div style="border-top:1px solid var(--border-color);margin-top:28px;padding-top:20px;text-align:center;">
      <span style="font-size:0.875rem;color:var(--text-muted);">New to Costume Store?</span>
      <a href="{{ url_for('register') }}" style="display:block;margin-top:8px;font-size:0.9rem;font-weight:700;color:var(--primary);text-decoration:none;">
        Create an Account &rarr;
      </a>
    </div>

  </div>
</div>
{% endblock %}
